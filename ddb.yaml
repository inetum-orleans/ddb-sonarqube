core:
  required_version: "1.8.0"
  project:
    name: sonarqube

copy:
  specs:
    - source: "https://github.com/mc1arke/sonarqube-community-branch-plugin/releases/download/26.10.0/sonarqube-community-branch-plugin-26.10.0.jar"
      destination: ".docker/sonarqube/plugins"
      filename: "sonarqube-community-branch-plugin.jar"
    - source: "https://github.com/mc1arke/sonarqube-community-branch-plugin/releases/download/26.10.0/sonarqube-webapp.zip"
      destination: ".docker/sonarqube/webapp"
      filename: "sonarqube-webapp.zip"
    - source: "https://github.com/dependency-check/dependency-check-sonar-plugin/releases/download/6.0.0/sonar-dependency-check-plugin-6.0.0.jar"
      destination: ".docker/sonarqube/plugins"
      filename: "sonar-dependency-check-plugin.jar"
    - source: "https://github.com/sonar-auth-oidc/sonar-auth-oidc/releases/download/v3.0.0/sonar-auth-oidc-plugin-3.0.0.jar"
      destination: ".docker/sonarqube/plugins"
      filename: "sonar-auth-oidc-plugin.jar"

docker:
  compose:
    project_name: sonarqube
  restart_policy: 'unless-stopped'

cookiecutter:
  templates:
    - template: gh:inetum-orleans/djp-postgres
      extra_context:
        postgres_version: "16"
